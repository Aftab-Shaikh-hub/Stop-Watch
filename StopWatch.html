<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stop Watch</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        body{
            display: flex;
            justify-content: center;
            align-items: center;
            background:linear-gradient(135deg,#141e30,#243b55);
              height: 100vh;
            width: 100vw;
        }

        .main{
        display: flex;
        flex-direction: column;
        height: 60vh;
        width: 60vw;
        border: 5px solid black;
          }

    .display{
        flex: 1;
        display: flex;
        justify-content: center;
        align-items: center;
        margin: 0;
        color: white;
        font-size: 5rem;
          }

    .buttons{
        flex: 1;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 20px;
       }

    .btn{
        font-size: 2rem;
        border: 2px solid black;
        border-radius: 10px;
        padding: 12px;
        transition: 0.3s;
         transform: 2s;
         height: 40%;
         width: 30%;
       
    }

    .btn:hover{
        background-color: green;
        transition: 0.3s;
        height: 38%;
         width: 28%;
    }

    .stopbtn{
        display: none;
    }


    </style>
</head>
<body>
    <div class="main">
        <h1 class="display">
            Stop watch
        </h1>
        <div class="buttons">
            <button class="startbtn btn">Start</button>
            <button class="stopbtn btn">Stop</button>
            <button class="resetbtn btn">Reset</button>
        </div>

    </div>
    
    <script>
        let display = document.querySelector(".display");
        let startbtn = document.querySelector(".startbtn");
        let stopbtn = document.querySelector(".stopbtn");
        let resetbtn = document.querySelector(".resetbtn");
        let milisec = 0;
        let min = 0;
        let hour = 0;
        let condition = true;
        let timer;

          
        startbtn.addEventListener("click", () =>
    {
        startbtn.style.display= "none";
        stopbtn.style.display = "block";

       
      
             const startFunction = () =>{

               
                display.textContent = `${hour}:${min}:${milisec}`;
                
                   milisec++;
                         if(milisec == 60)
             {
                  milisec = 0;
                  min++;
                  if(min == 60)
                  {
                        min = 0;
                        hour++;
                  }
             }
             };
              

           
                     timer = setInterval(startFunction,17);
    
             

          
  });



       stopbtn.addEventListener("click", ()=>{
        stopbtn.style.display="none";
        startbtn.style.display="block";
        clearInterval(timer);


       });

       resetbtn.addEventListener("click",()=>{
            milisec = 0 ;
            min = 0 ;
            hour = 0 ;
            display.textContent = `${hour}:${min}:${milisec}`;
       })

       

        
    </script>
</body>
</html>
